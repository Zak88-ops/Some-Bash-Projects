services:
  vote:
    build: ./vote
    ports:
      - "5000:80"
    networks: [front-tier, back-tier]
    depends_on:
      - redis
    restart: unless-stopped

  result:
    build: ./result
    ports:
      - "5001:4000"          # fixed: app listens on 4000
    networks: [front-tier, back-tier]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./worker
    networks: [back-tier]
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:alpine
    networks: [back-tier]
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [back-tier]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:

networks:
  front-tier:
  back-tier:
